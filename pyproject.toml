[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-segmentation"
version = "0.1.0"
description = "Sistema MLOps de segmentação de clientes (RFM) — Projeto Alura"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pyyaml>=6.0.1",
  "pydantic>=2.6.0",
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "pyarrow>=15.0.0",
  "scikit-learn>=1.4.0",
  "mlflow>=2.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.2.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.8.0",
]
airflow = ["apache-airflow==2.9.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
  "integration: testes de integração processamento/MLflow/storage",
  "smoke: smoke test de modelo registrado",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts", "api"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false

[tool.coverage.run]
source = ["customer_segmentation"]
branch = true

[tool.coverage.report]
fail_under = 50
skip_empty = true
