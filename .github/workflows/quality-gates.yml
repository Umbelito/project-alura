name: quality-gates

on:
  push:
    branches: [main, aula2, aula3, aula4]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts api

      - name: Type check
        run: mypy src/customer_segmentation --ignore-missing-imports

      - name: Tests + coverage
        run: |
          pytest tests/unit tests/contracts tests/integration -q \
            --cov=customer_segmentation \
            --cov-fail-under=50 \
            --cov-report=term-missing
